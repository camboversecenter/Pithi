<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="1200" height="920" font-family="'Segoe UI', system-ui, -apple-system, Roboto, 'Noto Sans Khmer', sans-serif">
  <defs>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9f1239"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e11d48"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arL" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="arF" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#cbd5e1"/>
    </marker>
    <style>
      .band{ fill:#94a3b8; font-size:12px; font-weight:700; letter-spacing:1.5px; }
      .ct{ fill:#0f172a; font-size:14.5px; font-weight:700; }
      .cd{ fill:#64748b; font-size:11.5px; }
      .rt{ fill:#0f172a; font-size:14.5px; font-weight:700; }
      .rs{ fill:#475569; font-size:11px; }
      .ru{ fill:#94a3b8; font-size:10.5px; font-weight:600; }
      .al{ fill:#475569; font-size:11px; font-weight:600; }
      .hubT{ fill:#ffffff; font-size:17px; font-weight:700; }
      .hubS{ fill:#ffe4e6; font-size:11.5px; }
    </style>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1200" height="920" fill="#f8fafc"/>

  <!-- header -->
  <rect x="0" y="0" width="1200" height="100" fill="url(#hdr)"/>
  <text x="48" y="50" fill="#ffffff" font-size="32" font-weight="700">ពិធី · PITHI</text>
  <text x="49" y="80" fill="#ffe4e6" font-size="16">Cambodian Ceremony Management Platform — features &amp; how they connect</text>
  <text x="1152" y="44" fill="#ffffff" font-size="12.5" font-weight="600" text-anchor="end" opacity="0.95">React · Supabase · Gemini · PWA</text>
  <text x="1152" y="66" fill="#ffe4e6" font-size="11" text-anchor="end">Khmer-language · offline-first · role-based</text>

  <!-- ===================== ROLES ===================== -->
  <text x="40" y="130" class="band">PEOPLE / ROLES</text>

  <!-- role chip helper: white card + colored dot -->
  <!-- Owner -->
  <rect x="40" y="140" width="262" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="64" cy="168" r="6" fill="#e11d48"/>
  <text x="82" y="172" class="rt">Event Owner</text>
  <text x="62" y="191" class="rs">GENERAL_USER · ម្ចាស់កម្មវិធី (host)</text>
  <text x="62" y="207" class="ru">→ Owner Portal · Budget · Marketplace</text>
  <!-- Organizer -->
  <rect x="326" y="140" width="262" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="350" cy="168" r="6" fill="#7c3aed"/>
  <text x="368" y="172" class="rt">Organizer</text>
  <text x="348" y="191" class="rs">ORGANIZER · អ្នករៀបចំ (planner)</text>
  <text x="348" y="207" class="ru">→ Organizer Portal · Marketplace</text>
  <!-- Vendors -->
  <rect x="612" y="140" width="262" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="636" cy="168" r="6" fill="#2563eb"/>
  <text x="654" y="172" class="rt">Vendors</text>
  <text x="634" y="191" class="rs">Chef · Hall · Music Band · Beauty Salon</text>
  <text x="634" y="207" class="ru">→ Vendor Services · Bookings</text>
  <!-- Admin -->
  <rect x="898" y="140" width="262" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="922" cy="168" r="6" fill="#334155"/>
  <text x="940" y="172" class="rt">Admin</text>
  <text x="920" y="191" class="rs">ADMIN · គ្រប់គ្រងប្រព័ន្ធ</text>
  <text x="920" y="207" class="ru">→ Admin Dashboard (users · stats)</text>

  <!-- roles feed into the app -->
  <path d="M171,214 L171,230" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#arF)"/>
  <path d="M457,214 L457,230" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#arF)"/>
  <path d="M743,214 L743,230" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#arF)"/>
  <path d="M1029,214 L1029,230" stroke="#cbd5e1" stroke-width="1.5" fill="none" marker-end="url(#arF)"/>

  <!-- ===================== FEATURE MAP (hub &amp; spoke) ===================== -->
  <text x="40" y="252" class="band">APPLICATION FEATURES &amp; RELATIONSHIPS</text>

  <!-- relationship arrows (draw before boxes so heads sit under boxes edges) -->
  <!-- Dashboard -> Hub -->
  <path d="M600,344 L600,392" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="588" y="372" class="al" text-anchor="end">overview · AI chat</text>
  <!-- Portals -> Hub -->
  <path d="M256,357 C370,357 405,412 493,420" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="322" y="372" class="al">create &amp; manage</text>
  <!-- Hub -> Invitations -->
  <path d="M493,462 C405,470 345,491 258,493" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="360" y="512" class="al" text-anchor="middle">invite guests</text>
  <!-- Invitations -> Budget (gift reports) -->
  <path d="M158,548 C180,576 245,588 296,588" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="188" y="556" class="al">gift reports</text>
  <!-- Marketplace -> Bookings -->
  <path d="M1042,396 L1042,450" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="1052" y="428" class="al">book</text>
  <!-- Bookings -> Hub -->
  <path d="M942,489 C820,486 760,458 707,452" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#ar)"/>
  <text x="812" y="512" class="al" text-anchor="middle">reserved for event</text>
  <!-- Admin -> Hub (oversight, dashed) -->
  <path d="M606,588 L601,488" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4" fill="none" marker-end="url(#arL)"/>
  <text x="616" y="536" class="al" fill="#64748b">moderate · stats</text>

  <!-- HUB: Ceremony -->
  <rect x="495" y="394" width="210" height="94" rx="18" fill="url(#hub)"/>
  <text x="600" y="432" class="hubT" text-anchor="middle">Ceremony / Event</text>
  <text x="600" y="454" class="hubS" text-anchor="middle">the central record</text>
  <text x="600" y="472" class="hubS" text-anchor="middle">date · budget · theme · KHQR</text>

  <!-- Satellite: Dashboard (top) -->
  <rect x="502" y="270" width="196" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="524" cy="298" r="6" fill="#e11d48"/>
  <text x="540" y="302" class="ct">Dashboard</text>
  <text x="524" y="322" class="cd">Home, calendar, quick actions</text>
  <text x="524" y="338" class="cd">+ PITHI AI chat assistant</text>

  <!-- Satellite: Portals (left-upper) -->
  <rect x="60" y="300" width="196" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="82" cy="328" r="6" fill="#db2777"/>
  <text x="98" y="332" class="ct">Organizer / Owner</text>
  <text x="82" y="352" class="cd">Portals — manage events,</text>
  <text x="82" y="368" class="cd">guests, AI plans</text>

  <!-- Satellite: Invitations &amp; RSVP (left-lower) -->
  <rect x="60" y="456" width="196" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="82" cy="484" r="6" fill="#d97706"/>
  <text x="98" y="488" class="ct">Invitations &amp; RSVP</text>
  <text x="82" y="508" class="cd">Digital cards, guest RSVP,</text>
  <text x="82" y="524" class="cd">business-card scan</text>

  <!-- Satellite: Marketplace (right-upper) -->
  <rect x="944" y="300" width="196" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="966" cy="328" r="6" fill="#7c3aed"/>
  <text x="982" y="332" class="ct">Marketplace</text>
  <text x="966" y="352" class="cd">Vendor services — list,</text>
  <text x="966" y="368" class="cd">search, review</text>

  <!-- Satellite: Bookings (right-lower) -->
  <rect x="944" y="456" width="196" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="966" cy="484" r="6" fill="#2563eb"/>
  <text x="982" y="488" class="ct">Bookings</text>
  <text x="966" y="508" class="cd">Request → confirm → done,</text>
  <text x="966" y="524" class="cd">chat thread + audit log</text>

  <!-- Bottom row: Budget / Admin / Community -->
  <rect x="210" y="566" width="196" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="232" cy="594" r="6" fill="#059669"/>
  <text x="248" y="598" class="ct">Budget &amp; Finance</text>
  <text x="232" y="618" class="cd">Income / expense, confirm</text>
  <text x="232" y="634" class="cd">guest gifts (KHR→USD)</text>

  <rect x="508" y="566" width="196" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="530" cy="594" r="6" fill="#334155"/>
  <text x="546" y="598" class="ct">Admin Dashboard</text>
  <text x="530" y="618" class="cd">Users &amp; admins, system</text>
  <text x="530" y="634" class="cd">stats, data cleanup</text>

  <rect x="806" y="566" width="196" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="828" cy="594" r="6" fill="#0891b2"/>
  <text x="844" y="598" class="ct">Community Feed</text>
  <text x="828" y="618" class="cd">Posts, reactions, bookmarks,</text>
  <text x="828" y="634" class="cd">gated comments · all roles</text>

  <!-- legend -->
  <line x1="1006" y1="596" x2="1030" y2="596" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="1036" y="600" class="cd">action / data flow</text>
  <line x1="1006" y1="618" x2="1030" y2="618" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arL)"/>
  <text x="1036" y="622" class="cd">oversight</text>

  <!-- features -> platform -->
  <path d="M600,660 L600,700" stroke="#cbd5e1" stroke-width="1.6" fill="none" marker-end="url(#arF)"/>
  <text x="612" y="684" class="al" fill="#64748b">every screen uses</text>

  <!-- ===================== PLATFORM SERVICES ===================== -->
  <text x="40" y="690" class="band">PLATFORM SERVICES (cross-cutting)</text>

  <rect x="40" y="704" width="262" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="64" cy="732" r="6" fill="#c026d3"/>
  <text x="82" y="736" class="ct">AI · Google Gemini</text>
  <text x="62" y="758" class="cd">Plans, images, receipt/card OCR,</text>
  <text x="62" y="775" class="cd">moderation, function-calling chat</text>

  <rect x="326" y="704" width="262" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="350" cy="732" r="6" fill="#059669"/>
  <text x="368" y="736" class="ct">Data Service</text>
  <text x="348" y="758" class="cd">All CRUD · Supabase ⇄ localStorage</text>
  <text x="348" y="775" class="cd">graceful fallback</text>

  <rect x="612" y="704" width="262" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="636" cy="732" r="6" fill="#d97706"/>
  <text x="654" y="736" class="ct">Storage</text>
  <text x="634" y="758" class="cd">Images — services, ceremonies,</text>
  <text x="634" y="775" class="cd">receipts, templates (⇄ base64)</text>

  <rect x="898" y="704" width="262" height="86" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="922" cy="732" r="6" fill="#2563eb"/>
  <text x="940" y="736" class="ct">PWA / Offline</text>
  <text x="920" y="758" class="cd">Installable, cached app shell,</text>
  <text x="920" y="775" class="cd">full offline demo mode</text>

  <!-- platform -> backend -->
  <path d="M600,790 L600,824" stroke="#cbd5e1" stroke-width="1.6" fill="none" marker-end="url(#arF)"/>
  <text x="612" y="812" class="al" fill="#64748b">runs on</text>

  <!-- ===================== BACKEND ===================== -->
  <text x="40" y="814" class="band">BACKEND &amp; HOSTING</text>

  <rect x="40" y="828" width="357" height="72" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="64" cy="856" r="6" fill="#047857"/>
  <text x="82" y="860" class="ct">Supabase</text>
  <text x="62" y="882" class="cd">Postgres + RLS · Auth (Google OAuth) · Storage bucket</text>

  <rect x="421" y="828" width="357" height="72" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="445" cy="856" r="6" fill="#c026d3"/>
  <text x="463" y="860" class="ct">Edge Function: gemini-proxy</text>
  <text x="443" y="882" class="cd">Keeps the API key server-side → Google Gemini API</text>

  <rect x="802" y="828" width="358" height="72" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <circle cx="826" cy="856" r="6" fill="#ea580c"/>
  <text x="844" y="860" class="ct">Cloudflare Pages</text>
  <text x="824" y="882" class="cd">Static hosting for the built PWA · HashRouter (SPA)</text>
</svg>
