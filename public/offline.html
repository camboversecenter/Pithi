<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>គ្មានការតភ្ជាប់អ៊ីនធឺណិត - PITHI</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: white;
      padding: 40px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px border #e2e8f0;
      max-width: 420px;
      width: 100%;
    }
    .logo-container {
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
    }
    .offline-icon {
      width: 80px;
      height: 80px;
      color: #be123c; /* Rose 700 */
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      color: #be123c;
      margin: 0 0 12px 0;
      font-weight: 700;
    }
    h2 {
      font-size: 16px;
      color: #475569;
      margin: 0 0 20px 0;
      font-weight: 500;
      line-height: 1.5;
    }
    p {
      font-size: 14px;
      color: #64748b;
      margin: 0 0 30px 0;
      line-height: 1.6;
    }
    .btn {
      background-color: #be123c;
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      box-shadow: 0 4px 12px rgba(190, 18, 60, 0.2);
    }
    .btn:hover {
      background-color: #9f1239;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .footer {
      margin-top: 32px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <!-- High contrast Signal/Offline cloud Icon -->
      <svg class="offline-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke="currentColor" />
      </svg>
    </div>
    <h1>គ្មានការតភ្ជាប់អ៊ីនធឺណិត</h1>
    <h2>You are currently offline</h2>
    <p>
      សូមពិនិត្យមើលការតភ្ជាប់បណ្តាញទូរស័ព្ទ ឬប្រព័ន្ធ Wi-Fi របស់អ្នកឡើងវិញ រួចសាកល្បងសារជាថ្មីម្តងទៀត។<br/>
      Please check your internet connection or network data settings and try again.
    </p>
    <button class="btn" onclick="retryConnection()">
      សាកល្បងឡើងវិញ / Retry
    </button>
  </div>
  <div class="footer">
    &copy; 2026 ពិធី - PITHI Ceremony Management
  </div>

  <script>
    function retryConnection() {
      // Reload current page
      window.location.reload();
    }
    
    // Listen for online status transition to automatically reload
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
